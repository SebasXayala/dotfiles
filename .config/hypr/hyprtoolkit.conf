# Tema de hyprlauncher (y otras apps de Hyprland). Colores desde la paleta central.
source = ~/.config/theme/generated/colors.conf

background       = $bg
base             = $surface
alternate_base   = $surface1
text             = $fg
bright_text      = $fg
link_text        = $accent
accent           = $accent
accent_secondary = $accent2

rounding_large = 14
rounding_small = 8

font_family           = Noto Sans
font_family_monospace = JetBrainsMono Nerd Font
font_size             = 11
icon_theme            = WhiteSur
