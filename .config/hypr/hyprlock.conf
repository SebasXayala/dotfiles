# Colores desde la paleta central (generados por apply.sh)
source = ~/.config/theme/generated/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fondo: captura del escritorio difuminada
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Noto Sans
    color = $fg
    position = 0, 220
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Noto Sans
    color = $fg_dim
    position = 0, 130
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 300, 50
    rounding = -1
    outline_thickness = 2
    outer_color = $accent
    inner_color = $surface
    font_color = $fg
    check_color = $warn
    fail_color = $urgent
    fail_text = Contraseña incorrecta
    placeholder_text = <span foreground="##a5b1c2">Contraseña</span>
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}

# Marca
label {
    monitor =
    text = ⬢ snaplabs
    font_size = 13
    font_family = Noto Sans
    color = $accent
    position = 0, 40
    halign = center
    valign = bottom
}
